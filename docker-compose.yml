name: sapsap

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: sapsap_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sapsap
      POSTGRES_USER: sapsap
      POSTGRES_PASSWORD: secret
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sapsap -d sapsap"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sapsap_backend
    restart: unless-stopped
    ports:
      - "8080:8000"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  web-business:
    build:
      context: ./web-business
      dockerfile: Dockerfile.dev
    container_name: sapsap_web_business
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - ./web-business:/app
      - /app/node_modules

  web-admin:
    build:
      context: ./web-admin
      dockerfile: Dockerfile.dev
    container_name: sapsap_web_admin
    restart: unless-stopped
    ports:
      - "4201:4201"
    volumes:
      - ./web-admin:/app
      - /app/node_modules

  mobile-contributor:
    build:
      context: ./mobile-contributor
      dockerfile: Dockerfile.dev
    container_name: sapsap_mobile_contributor
    restart: unless-stopped
    ports:
      - "8100:8100"
    volumes:
      - ./mobile-contributor:/app
      - /app/node_modules

volumes:
  postgres_data:
